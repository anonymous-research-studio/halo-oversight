[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "halo-oversight"
version = "1.1.0"
description = "Obligation-preserving release gate and oversight-allocation simulator (HALO)"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
dependencies = ["numpy>=1.21"]

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools]
packages = ["halo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
